<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やることの詳細</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="${todo.title}">やること</h1>
        <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">メモ</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category}">ジャンル</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">期限</span></p>
        <p class="confirm-value">予算額：<span th:text="${todo.budgetAmount == null ? '（入力なし）' : todo.budgetAmount + '円'}">予算額</span></p>
        <p class="confirm-value">実際の金額：<span th:text="${todo.actualAmount == null ? '（入力なし）' : todo.actualAmount + '円'}">実際の金額</span></p>
        <p class="confirm-value" th:if="${todo.budgetAmount != null and todo.actualAmount != null}">
            差額：<span th:text="${todo.budgetAmount >= todo.actualAmount ? '予算内 ' + (todo.budgetAmount - todo.actualAmount) + '円' : '予算超過 ' + (todo.actualAmount - todo.budgetAmount) + '円'}">差額</span>
        </p>
        <p class="confirm-value">状態：<span th:text="${todo.completed ? '完了' : '未完了'}">状態</span></p>
        <div class="confirm-actions">
            <a class="btn" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
            <a class="btn sub" th:href="@{/todos}">一覧へ</a>
        </div>
    </main>
</body>
</html>
