<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${year}年${month}月のカレンダー|">カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js" defer></script>
</head>
<body>
    <main class="container calendar-container">
        <div class="page-heading"><h1 class="page-title" th:text="|${year}年${month}月|">年月</h1><button class="theme-toggle" type="button" data-theme-toggle aria-label="画面テーマを切り替える"><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg></button></div>
        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-group">
            <a class="btn sub" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前月</a>
            <a class="btn sub" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">翌月</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="btn sub" th:href="@{/todos}">一覧</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </div>
        </nav>
        <p id="holiday-unavailable" hidden>祝日を取れませんでした</p>
        <table class="calendar-table" th:attr="data-from=${firstDay}, data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${#numbers.sequence(0, (leadingBlankDays + daysInMonth + trailingBlankDays) / 7 - 1)}">
                    <td th:each="weekday : ${#numbers.sequence(0, 6)}"
                        th:with="dayNumber=${week * 7 + weekday - leadingBlankDays + 1}"
                        th:attr="data-date=${dayNumber >= 1 and dayNumber <= daysInMonth ? firstDay.plusDays(dayNumber - 1) : null}">
                        <span th:if="${dayNumber >= 1 and dayNumber <= daysInMonth}" th:text="${dayNumber}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
<script>
    async function loadTodosForCalendar() {
        const calendarTable = document.querySelector(".calendar-table");
        const from = calendarTable.dataset.from;
        const to = calendarTable.dataset.to;
        const url = `/api/todos?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
        const res = await fetch(url);
        const todos = await res.json();
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        for (const cell of calendarTable.querySelectorAll("td[data-date]")) {
            const cellDate = cell.dataset.date;
            const matchingTodos = todos.filter(todo => todo.dueDate === cellDate);
            const visibleTodos = matchingTodos.slice(0, 3);
            for (const todo of visibleTodos) {
                const todoName = document.createElement("div");
                const editLink = document.createElement("a");
                editLink.href = `/todos/${todo.id}/edit`;
                const dueDate = new Date(`${todo.dueDate}T00:00:00`);
                const isOverdue = dueDate < today && !todo.completed;
                if (isOverdue) {
                    editLink.classList.add("calendar-todo-overdue");
                    editLink.title = "期限超過";
                }
                const categoryIcons = {
                    "旅行": {symbol: "✈", style: "travel"},
                    "グルメ": {symbol: "🍴", style: "gourmet"},
                    "買い物": {symbol: "🛍️", style: "shopping"},
                    "体験": {symbol: "★", style: "experience"},
                    "学習": {symbol: "📖", style: "learning"}
                };
                const categoryIcon = document.createElement("span");
                const icon = categoryIcons[todo.category] || {symbol: "●", style: "other"};
                categoryIcon.className = `calendar-category-icon category-icon-${icon.style}`;
                categoryIcon.setAttribute("aria-hidden", "true");
                categoryIcon.textContent = icon.symbol;
                editLink.setAttribute("aria-label", `${todo.category}：${todo.title}`);
                if (isOverdue) {
                    editLink.setAttribute("aria-label", `期限超過、${todo.category}：${todo.title}`);
                }
                editLink.appendChild(categoryIcon);
                const titleText = document.createElement("span");
                titleText.className = "calendar-todo-title";
                titleText.dataset.fullTitle = todo.title;
                titleText.textContent = formatCalendarTodoTitle(todo.title, mobileCalendarQuery.matches);
                editLink.appendChild(titleText);
                todoName.appendChild(editLink);
                cell.appendChild(todoName);
            }
            const remainingCount = matchingTodos.length - visibleTodos.length;
            if (remainingCount > 0) {
                const remaining = document.createElement("div");
                remaining.textContent = `ほか ${remainingCount}件`;
                cell.appendChild(remaining);
            }
        }
    }

    const mobileCalendarQuery = window.matchMedia("(max-width: 600px)");

    function formatCalendarTodoTitle(title, isMobile) {
        const characters = Array.from(title);
        return isMobile && characters.length > 5
            ? `${characters.slice(0, 5).join("")}…`
            : title;
    }

    mobileCalendarQuery.addEventListener("change", event => {
        document.querySelectorAll(".calendar-todo-title").forEach(titleElement => {
            titleElement.textContent = formatCalendarTodoTitle(titleElement.dataset.fullTitle, event.matches);
        });
    });

    async function loadHolidaysForCalendar() {
        const calendarTable = document.querySelector(".calendar-table");
        const from = calendarTable.dataset.from;
        const to = calendarTable.dataset.to;
        const url = `/api/holidays?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
        const res = await fetch(url);
        const holidays = await res.json();

        if (res.headers.get("X-Holidays-Unavailable") === "true") {
            document.getElementById("holiday-unavailable").hidden = false;
        }

        for (const cell of calendarTable.querySelectorAll("td[data-date]")) {
            const cellDate = cell.dataset.date;
            const dayOfWeek = new Date(`${cellDate}T00:00:00`).getDay();

            if (holidays[cellDate]) {
                cell.dataset.dayType = "holiday";
                cell.title = holidays[cellDate];
            } else if (dayOfWeek === 0) {
                cell.dataset.dayType = "sunday";
            } else if (dayOfWeek === 6) {
                cell.dataset.dayType = "saturday";
            }
        }
    }

    loadTodosForCalendar();
    loadHolidaysForCalendar();
</script>
</html>
