<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やることを登録</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">やることを登録</h1>
        <form th:action="@{/todos/confirm}" th:object="${todo}" method="post">
            <div class="form-row">
                <label class="form-label" for="title">やること</label>
                <input class="form-input" id="title" type="text" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="detail">メモ</label>
                <input class="form-input" id="detail" type="text" th:field="*{detail}">
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" th:field="*{category}">
                    <option value="">選択してください</option>
                    <option value="旅行">旅行</option>
                    <option value="グルメ">グルメ</option>
                    <option value="買い物">買い物</option>
                    <option value="体験">体験</option>
                    <option value="学習">学習</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority">優先度</label>
                <select class="form-input" id="priority" th:field="*{priority}">
                    <option value="">選択してください</option>
                    <option value="1">高</option>
                    <option value="2">中</option>
                    <option value="3">低</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="dueDate">期限</label>
                <input class="form-input" id="dueDate" type="date" th:field="*{dueDate}">
            </div>
            <div class="form-row">
                <label class="form-label" for="budgetAmount">予算額（円）</label>
                <input class="form-input" id="budgetAmount" type="number" min="0" step="1" th:field="*{budgetAmount}">
                <p class="error" th:if="${#fields.hasErrors('budgetAmount')}" th:errors="*{budgetAmount}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="actualAmount">支出額（円）</label>
                <input class="form-input" id="actualAmount" type="number" min="0" step="1" th:field="*{actualAmount}">
                <p class="error" th:if="${#fields.hasErrors('actualAmount')}" th:errors="*{actualAmount}"></p>
            </div>
            <button class="btn" type="submit">確認する</button>
            <a class="btn sub" th:href="@{/todos}">一覧へ</a>
        </form>
    </main>
</body>
</html>
